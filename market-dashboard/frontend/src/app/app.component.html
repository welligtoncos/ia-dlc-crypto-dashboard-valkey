<main class="painel">
  <header class="painel__header">
    <h1>Dashboard de Mercado</h1>
    <p class="painel__hint">Múltiplas moedas via config (H11)</p>
  </header>

  @if (carregando) {
    <p>Carregando…</p>
  } @else if (erro) {
    <p class="painel__erro" role="alert">{{ erro }}</p>
  } @else {
    <div class="painel__grid">
      @for (item of itens; track item.moeda) {
        <app-card-moeda [dados]="item" />
      }
    </div>
  }
</main>

services:
  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      DASHBOARD_COIN_IDS: bitcoin,ethereum,solana
    depends_on:
      valkey:
        condition: service_healthy

  # H12 — worker Celery (mesma imagem; broker/backend = Valkey)
  worker:
    build: ./backend
    command: celery -A celery_app worker --loglevel=info
    environment:
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      DASHBOARD_COIN_IDS: bitcoin,ethereum,solana
    depends_on:
      valkey:
        condition: service_healthy

